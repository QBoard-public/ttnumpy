---
# Builds the documentation and publishes it on GitHub Pages. Development,
# tests and benchmarks run in GitLab CI at
# https://git.qboard.tech/qboard/rnd/ttnumpy; this repository mirrors its
# main branch.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# a deploy in progress finishes before the next one starts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # dependency groups need pip 25.1 or newer
      - name: Install the package with the docs group
        run: |
          python -m pip install -U pip
          python -m pip install -e . --group docs

      - name: Build the documentation
        run: python -m sphinx -b html -W -d "$RUNNER_TEMP/doctrees" docs docs/_build/html

      - name: Upload the rejected build
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: docs-rejected
          path: docs/_build/html/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/_build/html

  # GitHub Pages serves the result at https://qboard-public.github.io/ttnumpy/.
  # The deploy action fetches the artifact by name, so this job needs no
  # checkout of its own.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
