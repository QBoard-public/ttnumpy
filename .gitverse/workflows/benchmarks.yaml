---
name: benchmarks

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sizes:
        description: QTT depths per axis, space separated
        type: string
        default: 7 8 9 10

concurrency:
  group: ${{ gitverse.workflow }}-${{ gitverse.ref }}
  cancel-in-progress: true

env:
  PIP_INDEX_URL: https://mirror.qboard.tech/repository/pypi/simple
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  poisson:
    runs-on: docker
    container:
      image: python:3.10-bookworm
    # the results are informational: a slow or failing backend must not mark master red
    continue-on-error: true
    timeout-minutes: 240
    steps:
      - name: Install Node.js required by actions and the PETSc build prerequisites
        run: |
          sed -i "s|deb.debian.org|${QBRD_MIRROR_HOST:-mirror.qboard.tech}/repository|" \
              /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends nodejs libopenblas-dev liblapack-dev

      - name: Check out sources
        uses: actions/checkout@v4

      # PETSc has no prebuilt wheels, so the cached wheel saves its build from source
      - name: Restore the pip cache
        uses: actions/cache@v3
        with:
          key: pip-benchmark-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-benchmark-
          path: ~/.cache/pip

      - name: Install the package with the benchmark extras
        run: python3 -m pip install -e '.[benchmark]'

      # the input is passed as an environment variable rather than expanded into the script
      - name: Run the Poisson benchmarks
        run: python3 -m benchmarks.poisson --sizes ${BENCHMARK_SIZES} --output-dir benchmark-results
        env:
          BENCHMARK_SIZES: ${{ gitverse.event.inputs.sizes || '7 8 9 10' }}

      - name: Upload the benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poisson-benchmark-results
          path: benchmark-results/
          if-no-files-found: ignore
          retention-days: 30
