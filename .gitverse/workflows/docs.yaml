---
name: docs

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ gitverse.workflow }}-${{ gitverse.ref }}
  cancel-in-progress: false

env:
  PIP_INDEX_URL: https://mirror.qboard.tech/repository/pypi/simple
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  build:
    runs-on: docker
    container:
      image: python:3.10-bookworm
    steps:
      - name: Install Node.js required by actions
        run: |
          sed -i "s|deb.debian.org|${QBRD_MIRROR_HOST:-mirror.qboard.tech}/repository|" \
              /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends nodejs

      - name: Check out sources
        uses: actions/checkout@v4

      - name: Restore the pip cache
        uses: actions/cache@v3
        with:
          key: pip-dev-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-dev-
          path: ~/.cache/pip

      - name: Install the package with the developer extras
        run: python3 -m pip install -e '.[dev]'

      - name: Build the documentation
        run: |
          python3 -m sphinx -b html -W -d /tmp/doctrees docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Upload the rejected build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-rejected
          path: docs/_build/html/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload pages artifact
        uses: gitverse/upload-pages-artifact@v1.0.0
        with:
          path: docs/_build/html

  # GitVerse Pages serves the result at https://qboard.gitverse.site/ttnumpy.
  # The deploy action fetches the artifact by name, so this job needs no
  # checkout of its own.
  deploy:
    needs: build
    runs-on: docker
    container:
      image: python:3.10-bookworm
    steps:
      - name: Install Node.js required by actions
        run: |
          sed -i "s|deb.debian.org|${QBRD_MIRROR_HOST:-mirror.qboard.tech}/repository|" \
              /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends nodejs

      - name: Deploy to GitVerse Pages
        uses: gitverse/deploy-pages@v1.0.0
