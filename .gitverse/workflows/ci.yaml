---
name: ci

on:
  push:
    branches: [master]
    tags: ["**"]
  pull_request:

# Cancel any previous workflow jobs
concurrency:
  group: ${{ gitverse.workflow }}-${{ gitverse.ref }}
  cancel-in-progress: true

env:
  PIP_INDEX_URL: https://mirror.qboard.tech/repository/pypi/simple
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  semgrep:
    runs-on: docker
    container:
      image: cr-mirror-rqc.qboard.tech/semgrep/semgrep:1.172.0
    steps:
      - name: Install Node.js required by actions
        run: |
          sed -i \
              "s|https://dl-cdn.alpinelinux.org/alpine|https://${QBRD_MIRROR_HOST:-mirror.qboard.tech}/repository/alpine|g" \
              /etc/apk/repositories
          apk add --no-cache nodejs

      - name: Check out sources
        uses: actions/checkout@v4

      - name: Run Semgrep analysis
        run: |
          semgrep ci --config=auto --force-color --verbose \
              --exclude-rule=yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

  build:
    runs-on: docker
    container:
      image: python:3.10-bookworm
    steps:
      - name: Install Node.js required by actions
        run: |
          sed -i "s|deb.debian.org|${QBRD_MIRROR_HOST:-mirror.qboard.tech}/repository|" \
              /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends nodejs

      - name: Check out sources
        uses: actions/checkout@v4

      - name: Restore the pip cache
        uses: actions/cache@v3
        with:
          key: pip-dev-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-dev-
          path: ~/.cache/pip

      - name: Install the package with the developer extras
        run: python3 -m pip install -e '.[dev]'

      - name: Import the package
        run: python3 -c 'import ttnumpy'

      - name: Build the documentation
        run: python3 -m sphinx -b html -W -d /tmp/doctrees docs docs/_build/html

      - name: Upload the documentation
        uses: actions/upload-artifact@v4
        with:
          name: build-docs
          path: docs/_build/html/
          retention-days: 7

  code_check:
    runs-on: docker
    container:
      image: python:3.10-bookworm
    steps:
      - name: Install Node.js required by actions
        run: |
          sed -i "s|deb.debian.org|${QBRD_MIRROR_HOST:-mirror.qboard.tech}/repository|" \
              /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends nodejs

      - name: Check out sources
        uses: actions/checkout@v4

      - name: Restore the pip cache
        uses: actions/cache@v3
        with:
          key: pip-dev-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-dev-
          path: ~/.cache/pip

      - name: Install the package with the developer extras
        run: python3 -m pip install -e '.[dev]'

      - name: Verify code formatting
        run: black . --check

      # the checkout belongs to another user, and git refuses to list its files otherwise
      - name: Run pylint
        run: |
          git config --global --add safe.directory "${PWD}"
          pylint $(git ls-files '*.py') --recursive y --max-line-length 160 --fail-under 9 -d invalid-name

  run_tests:
    runs-on: docker
    container:
      image: python:3.10-bookworm
    steps:
      - name: Install Node.js required by actions
        run: |
          sed -i "s|deb.debian.org|${QBRD_MIRROR_HOST:-mirror.qboard.tech}/repository|" \
              /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends nodejs

      - name: Check out sources
        uses: actions/checkout@v4

      - name: Restore the pip cache
        uses: actions/cache@v3
        with:
          key: pip-dev-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-dev-
          path: ~/.cache/pip

      - name: Install the package with the developer extras
        run: python3 -m pip install -e '.[dev]'

      - name: Run tests
        run: |
          pytest --cov --cov-report=term --cov-report=xml:coverage.xml \
              --junitxml=report.xml -o junit_family=xunit2

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run_tests-reports
          path: |
            coverage.xml
            report.xml
          if-no-files-found: ignore
          retention-days: 7
