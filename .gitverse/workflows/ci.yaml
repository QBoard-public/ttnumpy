name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:

  build:
    name: Build and documentation
    runs-on: cpu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and developer extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Import the package
        run: python -c "import ttnumpy"

      - name: Build the documentation
        run: python -m sphinx -b html docs docs/_build/html

      - name: Upload the rendered documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14

  code-check:
    name: Formatting and linting
    runs-on: cpu
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and developer extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check formatting
        run: black . --check

      - name: Lint
        run: pylint $(git ls-files '*.py') --recursive y --max-line-length 160 --fail-under 9 -d invalid-name

  test-coverage:
    name: Test coverage
    runs-on: cpu
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and developer extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run the suite with coverage
        run: pytest ttnumpy/test/ benchmarks/test/ --cov --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  ttnumpy-tests:
    name: Library tests
    runs-on: cpu
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and developer extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run the library tests
        run: pytest ttnumpy/test/ --junitxml=report_ttnumpy.xml -o junit_family=xunit2

      - name: Upload the test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-ttnumpy
          path: report_ttnumpy.xml
          retention-days: 30

  benchmarks-tests:
    name: Benchmark harness tests
    runs-on: cpu
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and developer extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run the benchmark harness tests
        run: pytest benchmarks/test/ --junitxml=report_benchmarks.xml -o junit_family=xunit2

      - name: Upload the test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-benchmarks
          path: report_benchmarks.xml
          retention-days: 30
