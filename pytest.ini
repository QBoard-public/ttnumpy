[pytest]
testpaths = ttnumpy/test benchmarks/test
python_files = test_*.py
addopts =
    -v
    --tb=short
    -ra
    --durations=10
    --color=yes
filterwarnings =
    # scipy raises this when its LU solve meets a matrix too ill-conditioned
    # for double precision. Reported rather than ignored, since the vector such
    # a solve returns varies with the BLAS build while the residual stays
    # small; not an error, since ill-conditioned operators are this library's
    # subject matter and the rcond estimate is itself a LAPACK result.
    default::scipy.linalg.LinAlgWarning
# Tests must not call ttnumpy.logger_config.setup_logging: leaving the ttnumpy logger
# unconfigured lets its records propagate to the handlers pytest installs, so
# caplog works, failure reports carry the log, and nothing is printed twice.
# Raise verbosity for a run with --log-cli-level=DEBUG.
#
# These formats use only standard LogRecord attributes. pytest applies them to
# every record in the process, including third-party ones, so ttnumpy's own
# %(module_path)s would raise KeyError on the first scipy or warnings record.
log_format = [%(name)s] %(filename)s:%(lineno)d %(levelname)s %(message)s
log_cli_format = [%(name)s] %(filename)s:%(lineno)d %(levelname)s %(message)s
log_date_format = %H:%M:%S
log_cli_date_format = %H:%M:%S
