[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttnumpy"
dynamic = ["version"]
description = "Tensor-train toolbox for numerical linear algebra"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
authors = [
  { name = "Cloud Quantum Technologies Limited Liability Company", email = "info@qboard.tech" },
]
maintainers = [
  { name = "Oleg Tatarkin" },
  { name = "Sergey Usmanov" },
]
dependencies = [
  "numpy>=2.1.0",
  "scipy>=1.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "black>=24.0.0",
  "pylint>=3.0.0",
  "sphinx>=7.0.0",
  "furo>=2024.0.0",
  "myst-parser>=4.0.0",
  "sphinx-autodoc-typehints>=2.0.0",
]
benchmark = [
  "pyamg>=5.2.0",
  "petsc4py>=3.21.0",
]
docs = [
  "sphinx>=7.0.0",
  "furo>=2024.0.0",
  "myst-parser>=4.0.0",
  "sphinx-autodoc-typehints>=2.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ttnumpy*"]
namespaces = true

[tool.setuptools.dynamic]
version = { attr = "ttnumpy.__version__" }

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 88


[tool.coverage.run]
source = ["ttnumpy", "benchmarks"]
omit = [
    "*/test/*",
    "*/__init__.py",
]

relative_files = true
